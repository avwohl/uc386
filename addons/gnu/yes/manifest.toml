name = "yes"
description = "POSIX `yes` capped at 1000 lines (no SIGPIPE under dos_emu)"
sources = ["main.c"]
expect_exit = 0
# 1000 * "y\n" = 2000 bytes. We don't pin the exact stdout in the
# manifest — checking exit_code + stdout-size in the harness via a
# custom check would be overkill for a demo. We at least pin the
# first few characters by setting expect_stdout to the literal.
# Build a 2000-byte string:
#   "y\n" * 1000
# TOML doesn't have a repetition operator, so emit explicitly via
# a multi-line basic string. We keep it short (10 lines) and let
# the harness be permissive — real check below is "exit 0, no error".
# (Full-output match would use a sidecar .expected file; punt.)
