[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uc386"
version = "0.2.5"
description = "C23 compiler targeting x86-32 (i386) and MS-DOS"
readme = "README.md"
license = "GPL-3.0-or-later"
# 3.11, not 3.10. uc386's own code and uc_core/upeep386 are all
# 3.10-clean, but uc_core depends on uplox, and uplox declares
# requires-python >=3.11 — so `pip install uc386` under 3.10 dies with
# ResolutionImpossible ("no matching distributions ... uplox"). The
# floor is set by the transitive dep, not by our syntax. If uplox ever
# lowers its floor, this can follow it back down.
requires-python = ">=3.11"
dependencies = [
    # Upper bound is load-bearing, not defensive: uc_core 0.4.0 renamed
    # TranslationUnit.declarations -> .items, and codegen.py:621 uses
    # .items. The published uc386 0.1.3 declares an unbounded
    # uc_core>=0.3.6, so pip gives it uc_core 0.4.0 and every compile
    # dies with AttributeError. Keep the bound in step with the API.
    "uc_core>=0.4.1,<0.5",
    "uplox>=3.3.0",
    "upeep386>=0.2.1",
]
authors = [
    {name = "uc386 developers"}
]
keywords = [
    "compiler", "c", "c23", "i386", "x86", "msdos", "dos",
    "cross-compiler", "retro-computing", "16-bit", "32-bit"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/avwohl/uc386"
Repository = "https://github.com/avwohl/uc386"
Issues = "https://github.com/avwohl/uc386/issues"

[project.scripts]
uc386 = "uc386.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uc386 = [
    "py.typed",
    "lib/*.asm",
    "lib/include/**/*.h",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.pytest.ini_options]
# Avoid pytest descending into upstream/ trees of fetched addons —
# they're not our code and they routinely import differently than
# pytest expects (e.g. `raise SystemExit` at module top level for
# unsupported targets). Our own test files all live outside upstream/.
norecursedirs = [
    "*/upstream/*", "upstream", "*/upstream", ".venv", "build", "dist",
    "__pycache__", ".git", ".pytest_cache",
]
