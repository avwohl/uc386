[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uc386"
version = "0.1.0"
description = "C23 compiler targeting x86-32 (i386) and MS-DOS"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "uc_core>=0.3.4",
]
authors = [
    {name = "uc386 developers"}
]
keywords = [
    "compiler", "c", "c23", "i386", "x86", "msdos", "dos",
    "cross-compiler", "retro-computing", "16-bit", "32-bit"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/avwohl/uc386"
Repository = "https://github.com/avwohl/uc386"
Issues = "https://github.com/avwohl/uc386/issues"

[project.scripts]
uc386 = "uc386.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uc386 = [
    "py.typed",
    "lib/*.asm",
    "lib/include/**/*.h",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.pytest.ini_options]
# Avoid pytest descending into upstream/ trees of fetched addons —
# they're not our code and they routinely import differently than
# pytest expects (e.g. `raise SystemExit` at module top level for
# unsupported targets). Our own test files all live outside upstream/.
norecursedirs = [
    "*/upstream/*", "upstream", "*/upstream", ".venv", "build", "dist",
    "__pycache__", ".git", ".pytest_cache",
]
