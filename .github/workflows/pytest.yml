name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Exercise both supported host platforms — addons.txt 2026-05-01
    # asks the install requirements work on linux (apt) and macOS
    # (brew). The macOS leg validates that pip install -e . + tests
    # still run after the dev workstation moved off macOS.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install nasm
      # Required by addons/test_gnu_addons.py — that test compiles each
      # in-tree addon's .c through uc386 (Python) → .asm and then
      # assembles via nasm before running under dos_emu. The addon
      # smoke tests for awk/doom/micropython skip cleanly without
      # nasm (their .bin is pre-built), but the parametrized GNU
      # path always builds fresh. apt + brew both ship nasm.
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          sudo apt-get update -y && sudo apt-get install -y nasm
        else
          brew install nasm
        fi
        nasm -v
      shell: bash
    - name: Install dependencies
      # The siblings are installed from git@main rather than PyPI on
      # purpose: this job is also the integration test that uc386 still
      # works against the TIP of uc_core/upeep386/upyle, so a breaking
      # change over there shows up here instead of in a user's install.
      # They must land before `pip install -e .`, which would otherwise
      # resolve `upeep386>=0.2.0` from PyPI.
      # `upyle` is the OMF→MZ+LE linker (repo is still named pyle). It
      # is NOT a pyproject dep -- only addons/harness/exe.py imports it
      # -- so pip never pulls it on its own, but addons/ needs it. Note
      # the name: `pyle` on PyPI is an unrelated third-party project.
      # `unicorn`: required by `uc386.dos_emu` so the addon harness +
      # parametrized GNU addon tests can run the assembled binaries.
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov unicorn
        pip install "uc_core @ git+https://github.com/avwohl/uc_core@main"
        pip install "upeep386 @ git+https://github.com/avwohl/upeep386@main"
        pip install "upyle @ git+https://github.com/avwohl/pyle@main"
        pip install -e .
    - name: Run tests
      # tests/ — uc386 unit tests (1320 cases, no external deps).
      # addons/ — addon smoke tests (doom, micropython REPL).
      # The addon tests skip cleanly when their .bin artifacts
      # don't exist (binaries are derived from upstream sources via
      # per-addon fetch.sh + build.sh, not checked in). Adding
      # addons/ to CI guards future addon-side test additions
      # without forcing CI to compile large upstream sources.
      run: pytest tests/ addons/ -v --tb=short
