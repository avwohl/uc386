name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Exercise both supported host platforms — addons.txt 2026-05-01
    # asks the install requirements work on linux (apt) and macOS
    # (brew). The macOS leg validates that pip install -e . + tests
    # still run after the dev workstation moved off macOS.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      # uc_core is not yet on PyPI; install it from GitHub. Remove this
      # step (and the uc_core>=... dep in pyproject will pick it up from
      # PyPI) once uc_core is published.
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install "uc_core @ git+https://github.com/avwohl/uc_core@main"
        pip install -e .
    - name: Run tests
      # tests/ — uc386 unit tests (1320 cases, no external deps).
      # addons/ — addon smoke tests (doom, micropython REPL).
      # The addon tests skip cleanly when their .bin artifacts
      # don't exist (binaries are derived from upstream sources via
      # per-addon fetch.sh + build.sh, not checked in). Adding
      # addons/ to CI guards future addon-side test additions
      # without forcing CI to compile large upstream sources.
      run: pytest tests/ addons/ -v --tb=short
