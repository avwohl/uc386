name: Release

# Builds the FOSS-addons + games-build-scripts tarballs and attaches
# them to a GitHub release whenever a tag matching v* is pushed.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for dev builds (e.g. dev-2026-04-30)'
        required: false
        default: 'dev'

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm bison
          python -m pip install --upgrade pip
          pip install pytest unicorn
          pip install "uc_core @ git+https://github.com/avwohl/uc_core@main"
          pip install -e .

      - name: Install DJGPP cross-compiler
        run: |
          mkdir -p ~/.local/opt
          curl -sL -o /tmp/djgpp.tar.bz2 \
            https://github.com/andrewwutw/build-djgpp/releases/download/v3.4/djgpp-linux64-gcc1220.tar.bz2
          tar xjf /tmp/djgpp.tar.bz2 -C ~/.local/opt
          ~/.local/opt/djgpp/bin/i586-pc-msdosdjgpp-gcc --version

      - name: Install OpenWatcom V2
        run: |
          mkdir -p ~/.local/opt/watcom
          curl -sL -o /tmp/watcom.bin \
            https://github.com/open-watcom/open-watcom-v2/releases/download/Current-build/open-watcom-2_0-c-linux-x64
          chmod +x /tmp/watcom.bin
          # The Linux self-extractor wants an interactive license accept; -i=u
          # = unattended user-mode install into the path we point to.
          /tmp/watcom.bin -dDstDir=$HOME/.local/opt/watcom -i=u || true
          ls $HOME/.local/opt/watcom/binl64/wcc386 || \
            (echo "watcom installer layout unexpected; listing:" && \
             find $HOME/.local/opt/watcom -name wcc386 -type f)
          echo "WATCOM=$HOME/.local/opt/watcom" >> $GITHUB_ENV
          echo "$HOME/.local/opt/watcom/binl64" >> $GITHUB_PATH

      - name: Run tests
        run: pytest tests/ -q

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build addon binaries (FOSS tarball)
        run: python -m addons.harness.package --version "${{ steps.ver.outputs.version }}" --foss-only

      - name: Build BWK awk
        run: |
          cd addons/gnu/awk-bwk
          ./fetch.sh
          ./build.sh
          ls -la build/awk.bin

      - name: Repackage with awk
        run: python -m addons.harness.package --version "${{ steps.ver.outputs.version }}" --foss-only

      - name: Build games-scripts tarball
        run: python -m addons.harness.package --version "${{ steps.ver.outputs.version }}" --games-only

      - name: Generate comparison table
        run: python -m addons.harness.compare --write

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uc386-release-${{ steps.ver.outputs.version }}
          path: |
            dist/*.tar.gz
            addons/results.md

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            addons/results.md
          body: |
            ## uc386 ${{ steps.ver.outputs.version }}

            Two release artifacts:

            - **`uc386-foss-addons-*.tar.gz`** — built FOSS binaries
              (16 utilities + BWK awk = ~62 KB total). Source: this
              repo (GPL-3.0) + sbase upstream (MIT) + one-true-awk
              (Lucent free license). Drop into a uc386-aware host
              and run via `dos_emu.run()`.

            - **`uc386-games-build-scripts-*.tar.gz`** — fetch + build
              scripts for Doom, Duke3D, Heretic, Hexen, ROTT,
              Descent. Run on your host: each script downloads the
              upstream public-source release and (when the build
              works) produces a uc386-format binary. Game data files
              (WAD, GRP, RTL) are NOT shipped — supply your own.

            See `addons/results.md` for size comparison vs gcc.
