name: Release

# Builds the FOSS-addons + games-build-scripts tarballs and attaches
# them to a GitHub release whenever a tag matching v* is pushed.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for dev builds (e.g. dev-2026-04-30)'
        required: false
        default: 'dev'

jobs:
  build-release:
    runs-on: ubuntu-latest
    # softprops/action-gh-release needs `contents: write` to create
    # the release; default GITHUB_TOKEN is read-only since 2023.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm bison
          python -m pip install --upgrade pip
          pip install pytest unicorn
          pip install "uc_core @ git+https://github.com/avwohl/uc_core@main"
          pip install -e .

      - name: Install DJGPP cross-compiler
        run: |
          mkdir -p ~/.local/opt
          curl -sL -o /tmp/djgpp.tar.bz2 \
            https://github.com/andrewwutw/build-djgpp/releases/download/v3.4/djgpp-linux64-gcc1220.tar.bz2
          tar xjf /tmp/djgpp.tar.bz2 -C ~/.local/opt
          ~/.local/opt/djgpp/bin/i586-pc-msdosdjgpp-gcc --version

      - name: Install OpenWatcom V2
        run: |
          # The Linux x64 "installer" is an ELF wrapper around a regular
          # ZIP archive. Running it via -i=u FPEs on the runner; unzip
          # the embedded archive directly instead — gives us the same
          # binl64/binl/lib386/h tree without invoking the installer at
          # all. Fast and reliable.
          mkdir -p ~/.local/opt/watcom
          curl -sL -o /tmp/watcom.bin \
            https://github.com/open-watcom/open-watcom-v2/releases/download/Current-build/open-watcom-2_0-c-linux-x64
          unzip -q /tmp/watcom.bin -d ~/.local/opt/watcom
          chmod +x ~/.local/opt/watcom/binl64/wcc386 \
                   ~/.local/opt/watcom/binl64/wlink \
                   ~/.local/opt/watcom/binl64/wcl386 || true
          ~/.local/opt/watcom/binl64/wcc386 -? 2>&1 | head -1 || \
            echo "wcc386 banner check failed (continuing — compare.py will skip)"
          echo "WATCOM=$HOME/.local/opt/watcom" >> $GITHUB_ENV
          echo "INCLUDE=$HOME/.local/opt/watcom/h" >> $GITHUB_ENV
          echo "$HOME/.local/opt/watcom/binl64" >> $GITHUB_PATH

      - name: Run tests
        run: pytest tests/ -q

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build addon binaries (FOSS tarball)
        run: python -m addons.harness.package --version "${{ steps.ver.outputs.version }}" --foss-only

      - name: Build BWK awk
        # Bison 3.x's awkgram.tab.c output uses typedef chains that
        # uc386 currently misparses inside function bodies (works fine
        # with the bison 2.3 the dev host has via brew). Don't fail
        # the release on this — the FOSS tarball ships without awk in
        # the meantime. Tracked as a known-issue.
        continue-on-error: true
        run: |
          cd addons/gnu/awk-bwk
          ./fetch.sh
          ./build.sh
          ls -la build/awk.bin

      - name: Repackage with awk
        if: success()
        run: python -m addons.harness.package --version "${{ steps.ver.outputs.version }}" --foss-only

      - name: Build games-scripts tarball
        run: python -m addons.harness.package --version "${{ steps.ver.outputs.version }}" --games-only

      - name: Build Doom binary (boots end-to-end under dos_emu)
        # Best-effort: if the upstream URL flakes or a uc386 regression
        # lands, the games tarball still ships scripts. The repackage
        # step below picks up the binary if it built.
        continue-on-error: true
        run: |
          cd addons/games/doom
          ./fetch.sh
          ./build.sh
          ls -la build/doom.bin

      - name: Repackage games with doom.bin
        if: success()
        run: python -m addons.harness.package --version "${{ steps.ver.outputs.version }}" --games-only

      - name: Generate comparison table
        run: python -m addons.harness.compare --write

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uc386-release-${{ steps.ver.outputs.version }}
          path: |
            dist/*.tar.gz
            addons/results.md

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            addons/results.md
          body: |
            ## uc386 ${{ steps.ver.outputs.version }}

            Two release artifacts:

            - **`uc386-foss-addons-*.tar.gz`** — built FOSS binaries
              + sources + a test runner. 16 utilities + BWK awk
              (~62 KB built) plus a per-addon `src/` tree
              (manifest.toml + .c sources or fetch.sh / build.sh)
              and `test_addons.py` that walks the manifests and
              runs every binary under `uc386.dos_emu`. Source
              provenance: this repo (GPL-3.0) + sbase upstream
              (MIT) + one-true-awk (Lucent free license).

            - **`uc386-games-build-scripts-*.tar.gz`** — fetch +
              build scripts for Doom, Duke3D, Heretic, Hexen, ROTT,
              Descent — plus a pre-built `bin/doom/doom.bin` (the
              one game that boots end-to-end under dos_emu today).
              Other games triage 100 % per-file but still need
              link-time stubs / `#pragma aux` codegen; their
              binaries will land here as those gaps close. Game
              data files (WAD, GRP, RTL) are NOT shipped — supply
              your own.

            See `addons/results.md` for size comparison vs gcc.
