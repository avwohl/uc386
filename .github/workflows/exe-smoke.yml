name: exe-smoke

# Validates `addons/harness/exe.py` end-to-end:
#   uc386 → .asm → nasm -f obj → wlink system causeway → .exe
#
# Runs only on Linux (Watcom has no native macOS build) and only
# on changes that actually affect the pipeline (the harness, the
# codegen, lib/, or this workflow itself) — keeps churn off PRs
# that only touch docs.

on:
  push:
    branches: [main]
    paths:
      - 'addons/harness/exe.py'
      - 'src/uc386/**'
      - 'lib/**'
      - '.github/workflows/exe-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'addons/harness/exe.py'
      - 'src/uc386/**'
      - 'lib/**'
      - '.github/workflows/exe-smoke.yml'
  workflow_dispatch:

jobs:
  exe-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install nasm
        run: sudo apt-get update -y && sudo apt-get install -y nasm
      - name: Install Open Watcom V2
        # Same install pattern as release.yml: the Linux x64 "installer"
        # is an ELF wrapper around a regular ZIP archive. Unzip it
        # directly (the installer FPEs under unattended runs).
        run: |
          mkdir -p ~/.local/opt/watcom
          curl -sL -o /tmp/watcom.bin \
            https://github.com/open-watcom/open-watcom-v2/releases/download/Current-build/open-watcom-2_0-c-linux-x64
          unzip -q /tmp/watcom.bin -d ~/.local/opt/watcom
          chmod +x ~/.local/opt/watcom/binl64/wlink || true
          echo "WATCOM=$HOME/.local/opt/watcom" >> $GITHUB_ENV
          echo "$HOME/.local/opt/watcom/binl64" >> $GITHUB_PATH
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install "uc_core @ git+https://github.com/avwohl/uc_core@main"
          pip install -e .
      - name: Build true.exe
        # Smallest possible C surface: `int main(void) { return 0; }`.
        # Any wlink failure is a Phase 1 wrapper bug or an OMF
        # compatibility issue, not "this addon happens to use a libc
        # symbol the bridge doesn't provide."
        # exe.py auto-binds pmodew.exe (the default extender) so the
        # output should be ~11 KB self-contained (PMODE/W + LE
        # payload), not 371 bytes (unbound LE that prints "This is
        # a PMODE/W executable" and exits).
        run: |
          python -m addons.harness.exe addons/gnu/true/main.c \
            -o /tmp/true.exe
          ls -la /tmp/true.exe
          file /tmp/true.exe
          # Self-contained .exe should be > 1 KB (PMODE/W is ~11 KB).
          # Catches the regression where the stub binary doesn't get
          # bound in.
          SIZE=$(stat -c '%s' /tmp/true.exe)
          if [ "$SIZE" -lt 1024 ]; then
            echo "FAIL: true.exe is only $SIZE bytes — extender wasn't bound"
            exit 1
          fi
          # `file` should mention PMODE/W explicitly.
          file /tmp/true.exe | grep -qi "PMODE/W" \
            || (echo "FAIL: file output doesn't mention PMODE/W" && exit 1)
          echo "PASS: true.exe is $SIZE bytes, PMODE/W bound"
      - name: Build cat.exe
        # cat exercises libc (putchar via INT 21h, file open/read/close).
        # Most likely failure mode if Phase 1 needs the calling-convention
        # bridge — surface it now.
        continue-on-error: true
        run: |
          python -m addons.harness.exe addons/gnu/cat/main.c \
            -o /tmp/cat.exe
          ls -la /tmp/cat.exe

      - name: Inspect true.exe structure
        # Quick post-build sanity: the file should have the MZ header,
        # an LE signature at the new-exe offset, and the PMODE/W
        # version banner somewhere in the bound stub.
        run: |
          xxd /tmp/true.exe | head -8
          # `strings` should show "PMODE/W" since the extender is
          # bundled as the MZ portion.
          strings /tmp/true.exe | grep -i "PMODE/W" | head -3

      - name: Install DOSBox
        # Phase 3: actually run the .exe under DOSBox to verify the
        # PMODE/W extender boots, switches to PM, runs our 32-bit
        # code, and exits cleanly. headless via SDL_VIDEODRIVER=dummy.
        run: |
          sudo apt-get install -y dosbox
          dosbox -version || true

      - name: Phase 3 smoke — true.exe under DOSBox
        # Drop true.exe into a working dir, write an autoexec.bat
        # that mounts it as C:, runs true.exe, then writes the DOS
        # errorlevel to a file we can read from the host. DOSBox
        # 0.74-3 doesn't forward DOS-side stdout to host stdout, so
        # the file-redirect trick is the cleanest signal.
        # Best-effort — failures don't block the rest of CI.
        continue-on-error: true
        run: |
          set +e   # don't let `cat` non-zero kill the diagnostic dump
          mkdir -p /tmp/dosbox-cwd
          chmod 777 /tmp/dosbox-cwd
          cp /tmp/true.exe /tmp/dosbox-cwd/true.exe
          # Diagnostic: first verify the mount can even write back
          # to the host. If `mount-test.txt` doesn't materialize,
          # the mount is read-only or syncs lazily.
          cat > /tmp/dosbox.conf <<'EOF'
          [sdl]
          fullscreen=false

          [cpu]
          core=normal

          [autoexec]
          mount c /tmp/dosbox-cwd
          c:
          echo mount-write-test > mount-test.txt
          echo before > result.txt
          true.exe
          echo errorlevel=%errorlevel% >> result.txt
          echo after >> result.txt
          exit
          EOF
          export SDL_VIDEODRIVER=dummy
          timeout 30 dosbox -conf /tmp/dosbox.conf -exit \
            > /tmp/dosbox.log 2>&1
          echo "dosbox exit: $?"
          echo '== /tmp/dosbox-cwd contents =='
          ls -la /tmp/dosbox-cwd
          # DOSBox 0.74-3 writes files with 8.3 short names (uppercase).
          # echo > result.txt ends up as RESULT.TXT on the host.
          RESULT="/tmp/dosbox-cwd/RESULT.TXT"
          echo '== RESULT.TXT =='
          cat "$RESULT" 2>&1
          echo '== dosbox log (filtered) =='
          grep -v '^ALSA\|^MIXER\|^MIDI\|^DOSBox switched' /tmp/dosbox.log | tail -25
          # Pass condition: RESULT.TXT has all three markers.
          if grep -q '^before' "$RESULT" 2>/dev/null \
             && grep -q '^errorlevel=0' "$RESULT" 2>/dev/null \
             && grep -q '^after' "$RESULT" 2>/dev/null; then
            echo "PASS: true.exe ran cleanly with errorlevel 0"
          else
            echo "FAIL: see diagnostic dumps above"
            exit 1
          fi
