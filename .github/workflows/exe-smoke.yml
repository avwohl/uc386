name: exe-smoke

# Validates `addons/harness/exe.py` end-to-end:
#   uc386 → .asm → nasm -f obj → upyle → MZ+LE .exe (DOS/32A bound)
#
# Open Watcom is deliberately NOT installed here. The default
# extender is DOS/32A (58c1f79) and `build_exe` always routes that
# through upyle — wlink has no `system dos32a` — so a Watcom install
# would be a ~100 MB download that nothing in this job consults.
# wlink is only needed for the causeway / dos4g extenders, which
# this workflow doesn't exercise.
#
# Runs only on Linux (that's where the DOSBox runtime legs work) and
# only on changes that actually affect the pipeline (the harness, the
# codegen, lib/, or this workflow itself) — keeps churn off PRs
# that only touch docs.

on:
  push:
    branches: [main]
    paths:
      - 'addons/harness/exe.py'
      - 'addons/gnu/**'
      - 'src/uc386/**'
      - 'lib/**'
      - '.github/workflows/exe-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'addons/harness/exe.py'
      - 'addons/gnu/**'
      - 'src/uc386/**'
      - 'lib/**'
      - '.github/workflows/exe-smoke.yml'
  workflow_dispatch:

jobs:
  exe-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install nasm
        run: sudo apt-get update -y && sudo apt-get install -y nasm
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install "uc_core @ git+https://github.com/avwohl/uc_core@main"
          pip install "upeep386 @ git+https://github.com/avwohl/upeep386@main"
          pip install "upyle @ git+https://github.com/avwohl/pyle@main"
          pip install -e .
      - name: Build true.exe (default extender = DOS/32A)
        # Smallest possible C surface: `int main(void) { return 0; }`.
        # Any failure here is a wrapper/OMF bug, not "this addon
        # happens to use a libc symbol the bridge doesn't provide."
        # upyle binds its pre-bound DOS/32A stub, so the output should
        # be ~32.8 KB self-contained (stub + LE payload), not a few
        # hundred bytes of unbound LE.
        run: |
          python -m addons.harness.exe addons/gnu/true/main.c \
            -o /tmp/true.exe
          ls -la /tmp/true.exe
          file /tmp/true.exe
          # The DOS/32A stub alone is ~27.5 KB, so a correctly bound
          # .exe clears 16 KB comfortably. Catches the regression
          # where the stub doesn't get bound in at all.
          SIZE=$(stat -c '%s' /tmp/true.exe)
          if [ "$SIZE" -lt 16384 ]; then
            echo "FAIL: true.exe is only $SIZE bytes — extender wasn't bound"
            exit 1
          fi
          # `file` should name DOS/32A explicitly. It reports:
          #   "MS-DOS executable, LE executable for MS-DOS,
          #    DOS/32A DOS extender (embedded)"
          file /tmp/true.exe | grep -qi "DOS/32A" \
            || (echo "FAIL: file output doesn't mention DOS/32A" && exit 1)
          echo "PASS: true.exe is $SIZE bytes, DOS/32A bound"

      - name: Build true.exe with --extender=pmodew
        # PMODE/W is still a supported option and halves the size, so
        # keep it from bit-rotting — but it is NOT the default: its
        # real-mode call path hangs on any DOS call touching a
        # physical sector, so a PMODE/W build can't do disk I/O on
        # real DOS. Bind-only check; the runtime legs below all use
        # the DOS/32A default.
        run: |
          python -m addons.harness.exe addons/gnu/true/main.c \
            --extender=pmodew -o /tmp/true_pmodew.exe
          ls -la /tmp/true_pmodew.exe
          file /tmp/true_pmodew.exe
          SIZE=$(stat -c '%s' /tmp/true_pmodew.exe)
          if [ "$SIZE" -lt 8192 ]; then
            echo "FAIL: pmodew true.exe is only $SIZE bytes — stub unbound"
            exit 1
          fi
          file /tmp/true_pmodew.exe | grep -qi "PMODE/W" \
            || (echo "FAIL: file output doesn't mention PMODE/W" && exit 1)
          echo "PASS: pmodew true.exe is $SIZE bytes, PMODE/W bound"
      - name: Build cat.exe
        # cat exercises libc (putchar via INT 21h, file open/read/close).
        # Most likely failure mode if Phase 1 needs the calling-convention
        # bridge — surface it now.
        continue-on-error: true
        run: |
          python -m addons.harness.exe addons/gnu/cat/main.c \
            -o /tmp/cat.exe
          ls -la /tmp/cat.exe

      - name: Build .exe for every in-tree GNU addon
        # Phase 4 surface: build .exe variants for all manifest-driven
        # addons. Reports which build cleanly vs which fail (the
        # calling-convention bridge isn't written yet, so addons that
        # use argv may produce .exe but crash at runtime — that's a
        # separate test).
        continue-on-error: true
        run: |
          mkdir -p /tmp/exe-all
          ok=0
          fail=0
          for d in addons/gnu/*/; do
            name=$(basename "$d")
            # Skip non-buildable: shared shims (_*), upstream-fetched
            # ports (awk-bwk), and the doc-only gawk stub. MicroPython
            # moved out to the freedos_micro_python repo.
            case "$name" in
              _*|awk-bwk|gawk) continue ;;
            esac
            [ -f "$d/main.c" ] || continue
            if python -m addons.harness.exe "$d/main.c" \
                 -o "/tmp/exe-all/$name.exe" 2>"/tmp/exe-all/$name.err"; then
              SIZE=$(stat -c '%s' "/tmp/exe-all/$name.exe" 2>/dev/null || echo 0)
              echo "PASS $name: $SIZE bytes"
              ok=$((ok + 1))
            else
              echo "FAIL $name: $(head -1 /tmp/exe-all/$name.err)"
              fail=$((fail + 1))
            fi
          done
          echo
          echo "== $ok built / $((ok+fail)) total =="

      - name: Inspect true.exe structure
        # Quick post-build sanity: the file should have the MZ header,
        # an LE signature at the new-exe offset, and the DOS/32A
        # version banner somewhere in the bound stub.
        run: |
          xxd /tmp/true.exe | head -8
          # `strings` should show "DOS/32A" since the extender is
          # bundled as the MZ portion (banner reads
          # "SUNSYS DOS/32A" / "DOS/32A -- DOS Extender version ...").
          strings /tmp/true.exe | grep -i "DOS/32A" | head -3 \
            || (echo "FAIL: no DOS/32A banner in the bound stub" && exit 1)

      - name: Install DOSBox
        # Phase 3: actually run the .exe under DOSBox to verify the
        # DOS/32A extender boots, switches to PM, runs our 32-bit
        # code, and exits cleanly. headless via SDL_VIDEODRIVER=dummy.
        run: |
          sudo apt-get install -y dosbox
          dosbox -version || true

      - name: Build false.exe + echo.exe
        run: |
          python -m addons.harness.exe addons/gnu/false/main.c -o /tmp/false.exe
          python -m addons.harness.exe addons/gnu/echo/main.c -o /tmp/echo.exe

      - name: Phase 3 smoke — true.exe under DOSBox
        # Drop true.exe into a working dir, write an autoexec.bat
        # that mounts it as C:, runs true.exe, then writes the DOS
        # errorlevel to a file we can read from the host. DOSBox
        # 0.74-3 doesn't forward DOS-side stdout to host stdout, so
        # the file-redirect trick is the cleanest signal.
        # Best-effort — failures don't block the rest of CI.
        continue-on-error: true
        run: |
          set +e   # don't let `cat` non-zero kill the diagnostic dump
          mkdir -p /tmp/dosbox-cwd
          chmod 777 /tmp/dosbox-cwd
          cp /tmp/true.exe /tmp/false.exe /tmp/dosbox-cwd/
          # Rename echo.exe → myecho.exe so the DOS shell builtin
          # `echo` doesn't intercept (`echo.exe args` is parsed as
          # the builtin `echo` with `exe args` — the .exe never runs).
          cp /tmp/echo.exe /tmp/dosbox-cwd/myecho.exe
          # Use `if errorlevel N` syntax (real DOS) instead of
          # `%errorlevel%` (DOSBox 0.74-3 doesn't expand it). The
          # `if errorlevel 1` branch fires for codes >= 1; the
          # negation (`if not errorlevel 1`) catches exit code 0.
          # Run BOTH true.exe (expect exit 0) and false.exe
          # (expect exit 1) — verifies we propagate non-zero
          # exits correctly via INT 21h AH=4Ch.
          cat > /tmp/dosbox.conf <<'EOF'
          [sdl]
          fullscreen=false

          [cpu]
          core=normal

          [autoexec]
          mount c /tmp/dosbox-cwd
          c:
          echo before > result.txt
          true.exe
          if errorlevel 1 echo true_failed >> result.txt
          if not errorlevel 1 echo true_ok >> result.txt
          false.exe
          if errorlevel 1 echo false_ok >> result.txt
          if not errorlevel 1 echo false_unexpected_zero >> result.txt
          myecho.exe hello dos > echo_out.txt
          echo after >> result.txt
          exit
          EOF
          export SDL_VIDEODRIVER=dummy
          timeout 30 dosbox -conf /tmp/dosbox.conf -exit \
            > /tmp/dosbox.log 2>&1
          echo "dosbox exit: $?"
          echo '== /tmp/dosbox-cwd contents =='
          ls -la /tmp/dosbox-cwd
          # DOSBox 0.74-3 writes files with 8.3 short names (uppercase).
          # echo > result.txt ends up as RESULT.TXT on the host.
          RESULT="/tmp/dosbox-cwd/RESULT.TXT"
          echo '== RESULT.TXT =='
          cat "$RESULT" 2>&1
          echo '== dosbox log (filtered) =='
          grep -v '^ALSA\|^MIXER\|^MIDI\|^DOSBox switched' /tmp/dosbox.log | tail -25
          ECHO_OUT="/tmp/dosbox-cwd/ECHO_OUT.TXT"
          echo '== ECHO_OUT.TXT (myecho.exe hello dos) =='
          cat "$ECHO_OUT" 2>&1
          # Required end-to-end signals:
          #   - true.exe exits 0, false.exe exits 1 (INT 21h AH=4Ch path)
          #   - myecho.exe writes "hello dos" via libc fputs/putchar
          #     (real DOS handles via the bridge stub) AND argv reaches
          #     main correctly (the bridge's PSP-via-ES parser).
          if grep -q '^before' "$RESULT" \
             && grep -q '^true_ok' "$RESULT" \
             && grep -q '^false_ok' "$RESULT" \
             && grep -q '^after' "$RESULT" \
             && grep -q '^hello dos$' "$ECHO_OUT" 2>/dev/null; then
            echo "PASS: true + false exit codes + myecho argv-via-PSP all work"
          elif grep -q '^true_failed' "$RESULT"; then
            echo "FAIL: true.exe exited non-zero (expected 0)"
            exit 1
          elif grep -q '^false_unexpected_zero' "$RESULT"; then
            echo "FAIL: false.exe exited 0 (expected 1) — INT 21h AH=4Ch lost AL"
            exit 1
          elif ! grep -q '^hello dos$' "$ECHO_OUT" 2>/dev/null; then
            echo "FAIL: myecho.exe didn't write 'hello dos' — argv or libc path broken"
            exit 1
          else
            echo "FAIL: see diagnostic dumps above"
            exit 1
          fi

      - name: Phase 8 — basename.exe with realistic argv
        # End-to-end check that a non-trivial argv-using program
        # produces correct output: `basename /a/b/c.exe .exe` → "c\n".
        # Exercises argv[1] (path) + argv[2] (suffix), strlen, fputs.
        run: |
          set +e
          mkdir -p /tmp/dosbox-base
          chmod 777 /tmp/dosbox-base
          # basename.exe builds via the all-addons step; copy from there.
          cp /tmp/exe-all/basename.exe /tmp/dosbox-base/base.exe
          cat > /tmp/dosbox-base.conf <<'EOF'
          [sdl]
          fullscreen=false

          [cpu]
          core=normal

          [autoexec]
          mount c /tmp/dosbox-base
          c:
          base.exe /a/b/c.exe .exe > out.txt
          exit
          EOF
          export SDL_VIDEODRIVER=dummy
          timeout 30 dosbox -conf /tmp/dosbox-base.conf -exit \
            > /tmp/dosbox-base.log 2>&1
          echo "dosbox exit: $?"
          OUT="/tmp/dosbox-base/OUT.TXT"
          echo '== OUT.TXT =='
          cat "$OUT" 2>&1
          if grep -q '^c$' "$OUT" 2>/dev/null; then
            echo "PASS: basename /a/b/c.exe .exe → 'c'"
          else
            echo "FAIL: expected 'c\\n', got something else"
            exit 1
          fi

      - name: Phase 8 — factor.exe with many argv args
        # Stresses argv with 4 numeric args + per-arg integer parsing
        # and printf output through the legacy format engine.
        # Verifies the libc → real-DOS-safe printf path works end-to-end.
        run: |
          set +e
          mkdir -p /tmp/dosbox-fac
          chmod 777 /tmp/dosbox-fac
          cp /tmp/exe-all/factor.exe /tmp/dosbox-fac/fac.exe
          cat > /tmp/dosbox-fac.conf <<'EOF'
          [sdl]
          fullscreen=false

          [cpu]
          core=normal

          [autoexec]
          mount c /tmp/dosbox-fac
          c:
          fac.exe 2 12 60 97 > out.txt
          exit
          EOF
          export SDL_VIDEODRIVER=dummy
          timeout 30 dosbox -conf /tmp/dosbox-fac.conf -exit \
            > /tmp/dosbox-fac.log 2>&1
          OUT="/tmp/dosbox-fac/OUT.TXT"
          echo '== OUT.TXT =='
          cat "$OUT" 2>&1
          if grep -q '^2: 2$' "$OUT" \
             && grep -q '^12: 2 2 3$' "$OUT" \
             && grep -q '^60: 2 2 3 5$' "$OUT" \
             && grep -q '^97: 97$' "$OUT"; then
            echo "PASS: factor.exe processed 4 argv numbers correctly"
          else
            echo "FAIL: factor output missing expected factorizations"
            exit 1
          fi

      - name: Phase 7 — argv parsing under DOSBox
        # Asserts the bridge stub correctly parses argc/argv from
        # the PSP. Builds argv_probe.exe (prints argc + each argv[i]),
        # runs it under DOSBox with `argv_pr.exe alpha beta`, and
        # checks that the output contains argc=3 + 'alpha' + 'beta'
        # (argv[0] stays as a "program" placeholder — DOS PSP doesn't
        # carry the program name).
        run: |
          set +e
          python -m addons.harness.exe addons/gnu/argv_probe/main.c \
            -o /tmp/argv_probe.exe
          ls -la /tmp/argv_probe.exe
          mkdir -p /tmp/dosbox-probe
          chmod 777 /tmp/dosbox-probe
          cp /tmp/argv_probe.exe /tmp/dosbox-probe/argv_pr.exe
          cat > /tmp/dosbox-probe.conf <<'EOF'
          [sdl]
          fullscreen=false

          [cpu]
          core=normal

          [autoexec]
          mount c /tmp/dosbox-probe
          c:
          argv_pr.exe alpha beta > probe.txt
          exit
          EOF
          export SDL_VIDEODRIVER=dummy
          timeout 30 dosbox -conf /tmp/dosbox-probe.conf -exit \
            > /tmp/dosbox-probe.log 2>&1
          echo "dosbox exit: $?"
          PROBE="/tmp/dosbox-probe/PROBE.TXT"
          echo '== PROBE.TXT =='
          cat "$PROBE" 2>&1
          echo '== dosbox log (filtered) =='
          grep -v '^ALSA\|^MIXER\|^MIDI\|^DOSBox switched' \
            /tmp/dosbox-probe.log | tail -15
          # Pass: bridge parsed PSP cmdline correctly.
          if grep -q '^argc=3$' "$PROBE" \
             && grep -q "^argv\[1\]@.*:'alpha'$" "$PROBE" \
             && grep -q "^argv\[2\]@.*:'beta'$" "$PROBE"; then
            echo "PASS: argc=3 + argv[1]='alpha' + argv[2]='beta'"
          else
            echo "FAIL: argv parsing didn't produce expected output"
            exit 1
          fi
