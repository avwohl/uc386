name: dosbox-x-bug

# End-to-end demo of the DOSBox-X PMODE/W INT 21h AH=0x40
# caller-state-dependent bug. Builds MP.EXE (the canonical
# reproducer — minimal NASM-only repros so far don't trigger
# the bug; see addons/gnu/micropython/dosbox-x-rig/pmwbug/
# README.md for the bisect log) and runs it under DOSBox-X
# vs classic DOSBox 0.74-3 vs QEMU+FreeDOS.
#
# Trigger conditions (bisected on macOS DOSBox-X 2026.05.02):
#   - DOSBox-X config drives MP.EXE via [autoexec] section
#   - autoexec ends with `exit` immediately after MP.EXE (or
#     a single non-echo command + exit)
#   - core=normal cputype=pentium memsize=16
#
# When triggered: MP.EXE's `_main → _write` (a normal cdecl
# call to a wrapper around `INT 21h AH=0x40 BX=1`) writes
# zero bytes to the redirected file. Earlier `INT 21h AH=0x40`
# calls from the bridge stub (low CS:EIP) work correctly with
# the SAME args.
#
# When NOT triggered (e.g., autoexec has more commands, no
# exit, or different shell context): MP.EXE runs to its REPL.
#
# Same MP.EXE under classic DOSBox 0.74-3 or QEMU+FreeDOS
# always works, regardless of autoexec layout.
#
# This workflow is independent of mp-rig.yml (which has full
# NE2000+SLIRP rig). Here we just need the bug — no networking.

on:
  push:
    branches: [main]
    paths:
      - 'addons/gnu/micropython/dosbox-x-rig/pmwbug/**'
      - '.github/workflows/dosbox-x-bug.yml'
  pull_request:
    branches: [main]
    paths:
      - 'addons/gnu/micropython/dosbox-x-rig/pmwbug/**'
      - '.github/workflows/dosbox-x-bug.yml'
  workflow_dispatch:

jobs:
  bug-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install nasm + DOSBox-X + DOSBox 0.74-3 + QEMU + mtools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
              nasm dosbox-x dosbox \
              qemu-system-x86 mtools \
              curl unzip
          dosbox-x --version 2>&1 | head -3
          dosbox --version 2>&1 | head -3
          qemu-system-i386 --version | head -1

      - name: Install Open Watcom V2
        run: |
          mkdir -p ~/.local/opt/watcom
          curl -sL -o /tmp/watcom.bin \
            https://github.com/open-watcom/open-watcom-v2/releases/download/Current-build/open-watcom-2_0-c-linux-x64
          unzip -q /tmp/watcom.bin -d ~/.local/opt/watcom
          chmod +x ~/.local/opt/watcom/binl64/wlink || true
          echo "WATCOM=$HOME/.local/opt/watcom" >> $GITHUB_ENV
          echo "$HOME/.local/opt/watcom/binl64" >> $GITHUB_PATH

      - name: Install Python deps (for exe.py bridge build)
        run: |
          python -m pip install --upgrade pip
          pip install "uc_core @ git+https://github.com/avwohl/uc_core@main"
          pip install -e .

      - name: Build PMWBUG.EXE (standalone, no bridge)
        run: |
          cd addons/gnu/micropython/dosbox-x-rig/pmwbug
          ./build.sh
          file PMWBUG.EXE
          ls -la PMWBUG.EXE

      - name: Fetch MP.EXE from latest mp-rig artifact
        # MP.EXE reliably triggers the bug with the right
        # autoexec; minimal NASM repros don't (yet — open
        # question what specifically about MP.EXE makes it
        # fire). Pull the binary from mp-rig.yml's most-recent
        # successful run so we don't have to rebuild it
        # (rebuild = ~85 min on CI).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find latest mp-rig run that uploaded mp-rig-artifacts.
          run_id=$(gh run list --workflow=mp-rig.yml \
              --status=completed \
              --limit=10 \
              --json databaseId,conclusion \
              --jq 'map(select(.conclusion=="success" or .conclusion=="failure")) | .[0].databaseId')
          if [ -z "$run_id" ]; then
              echo "No mp-rig run found — skipping MP.EXE bug demo"
              exit 0
          fi
          echo "Pulling MP.EXE from mp-rig run $run_id"
          mkdir -p /tmp/mp-rig-artifacts
          gh run download "$run_id" \
              --name mp-rig-artifacts \
              --dir /tmp/mp-rig-artifacts || \
              { echo "Artifact pull failed; skipping"; exit 0; }
          find /tmp/mp-rig-artifacts -name "MP.EXE" -exec cp {} /tmp/MP.EXE \;
          ls -la /tmp/MP.EXE
          file /tmp/MP.EXE

      - name: Run MP.EXE under DOSBox-X (bug-triggering config)
        # The exact bisected trigger: autoexec runs MP.EXE then
        # exits. With a redirect, `MP.EXE > OUT.TXT` is followed
        # ONLY by `exit` — no other commands.
        run: |
          if [ ! -f /tmp/MP.EXE ]; then
              echo "MP.EXE not available — skipping"
              exit 0
          fi
          mkdir -p /tmp/dx
          cp /tmp/MP.EXE /tmp/dx/MP.EXE
          cat > /tmp/dx/dosbox-x.conf << 'EOF'
          [cpu]
          cputype = pentium
          core    = normal
          cycles  = max
          [dosbox]
          memsize = 16

          [autoexec]
          mount C /tmp/dx
          C:
          MP.EXE > MPOUT.TXT
          exit
          EOF
          # SDL_VIDEODRIVER=dummy keeps headless runners happy.
          # `timeout -k 10` SIGKILLs 10s after SIGTERM if dosbox-x
          # ignores the terminate (some headless dosbox-x builds
          # do hang on SIGTERM).
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
              timeout -k 10 60 dosbox-x \
              -silent \
              -exit \
              -conf /tmp/dx/dosbox-x.conf \
              > /tmp/dosbox-x-stdout.log 2>&1 || true
          echo "=== MPOUT.TXT (DOSBox-X) — bytes & xxd dump ==="
          if [ -f /tmp/dx/MPOUT.TXT ]; then
              wc -c /tmp/dx/MPOUT.TXT
              xxd /tmp/dx/MPOUT.TXT
              cp /tmp/dx/MPOUT.TXT /tmp/dosbox-x-MPOUT.TXT
          else
              echo "(MPOUT.TXT not produced)"
          fi

      - name: Run MP.EXE under classic DOSBox 0.74-3
        # Same autoexec, same MP.EXE. Classic DOSBox should
        # produce the full output through the REPL banner.
        run: |
          if [ ! -f /tmp/MP.EXE ]; then
              echo "MP.EXE not available — skipping"
              exit 0
          fi
          mkdir -p /tmp/dc
          cp /tmp/MP.EXE /tmp/dc/MP.EXE
          cat > /tmp/dc/dosbox.conf << 'EOF'
          [cpu]
          cputype = pentium
          core    = normal
          cycles  = max
          [dosbox]
          memsize = 16

          [autoexec]
          mount C /tmp/dc
          C:
          MP.EXE > MPOUT.TXT
          exit
          EOF
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
              timeout -k 10 60 dosbox \
              -exit \
              -conf /tmp/dc/dosbox.conf \
              > /tmp/dosbox-classic-stdout.log 2>&1 || true
          echo "=== MPOUT.TXT (classic DOSBox) — bytes & xxd dump ==="
          if [ -f /tmp/dc/MPOUT.TXT ]; then
              wc -c /tmp/dc/MPOUT.TXT
              xxd /tmp/dc/MPOUT.TXT | head -50
              cp /tmp/dc/MPOUT.TXT /tmp/dosbox-classic-MPOUT.TXT
          else
              echo "(MPOUT.TXT not produced)"
          fi

      - name: Run MP.EXE under QEMU+FreeDOS
        # The actual production target. Should also produce
        # the full REPL banner.
        run: |
          if [ ! -f /tmp/MP.EXE ]; then
              echo "MP.EXE not available — skipping"
              exit 0
          fi
          wget -q "https://raw.githubusercontent.com/codercowboy/freedosbootdisks/master/bootdisks/freedos.boot.disk.1.4MB.img" \
              -O /tmp/freedos.img
          cp /tmp/freedos.img /tmp/qd.img
          mcopy -i /tmp/qd.img -o /tmp/MP.EXE ::MP.EXE
          {
              printf '@echo off\r\n'
              printf 'CTTY COM1\r\n'
              printf 'echo === before MP.EXE ===\r\n'
              printf 'MP.EXE\r\n'
              printf 'echo === finished ===\r\n'
          } > /tmp/AUTOEXEC.BAT
          mcopy -i /tmp/qd.img -o /tmp/AUTOEXEC.BAT ::AUTOEXEC.BAT

          qemu-system-i386 \
              -display none \
              -serial stdio \
              -fda /tmp/qd.img \
              -boot a \
              -m 16 \
              -no-reboot \
              < /dev/null > /tmp/qemu-OUT.txt 2>&1 &
          QEMU_PID=$!
          for i in $(seq 1 90); do
              sleep 1
              if grep -q "MicroPython" /tmp/qemu-OUT.txt 2>/dev/null; then
                  break
              fi
              if ! kill -0 $QEMU_PID 2>/dev/null; then
                  break
              fi
          done
          kill $QEMU_PID 2>/dev/null || true
          sleep 1
          kill -KILL $QEMU_PID 2>/dev/null || true
          wait $QEMU_PID 2>/dev/null || true
          echo "=== qemu-OUT.txt — head & MicroPython grep ==="
          wc -c /tmp/qemu-OUT.txt
          head -60 /tmp/qemu-OUT.txt | tail -40
          echo
          if grep -q "MicroPython" /tmp/qemu-OUT.txt; then
              echo "QEMU+FreeDOS: PASS — MicroPython REPL reached"
          else
              echo "QEMU+FreeDOS: MISS — REPL banner not found"
          fi

      - name: Verdict
        run: |
          echo "==========================="
          echo "DOSBox-X output size:"
          if [ -f /tmp/dosbox-x-MPOUT.TXT ]; then
              wc -c /tmp/dosbox-x-MPOUT.TXT
              if grep -q "mp-main-entered" /tmp/dosbox-x-MPOUT.TXT; then
                  echo "  '[mp-main-entered]' present — bug NOT reproduced"
              else
                  echo "  '[mp-main-entered]' MISSING — BUG REPRODUCED"
              fi
          else
              echo "  (no output)"
          fi

          echo
          echo "Classic DOSBox 0.74-3 output size:"
          if [ -f /tmp/dosbox-classic-MPOUT.TXT ]; then
              wc -c /tmp/dosbox-classic-MPOUT.TXT
              if grep -q "MicroPython" /tmp/dosbox-classic-MPOUT.TXT; then
                  echo "  REPL banner present — works as expected"
              else
                  echo "  REPL banner MISSING — unexpected"
              fi
          else
              echo "  (no output)"
          fi

          echo
          echo "QEMU+FreeDOS output:"
          if grep -q "MicroPython" /tmp/qemu-OUT.txt; then
              echo "  REPL banner present — works as expected"
          else
              echo "  REPL banner MISSING — unexpected"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dosbox-x-bug-artifacts
          path: |
            /tmp/MP.EXE
            /tmp/dosbox-x-MPOUT.TXT
            /tmp/dosbox-classic-MPOUT.TXT
            /tmp/qemu-OUT.txt
            /tmp/dosbox-x-stdout.log
            /tmp/dosbox-classic-stdout.log
            addons/gnu/micropython/dosbox-x-rig/pmwbug/PMWBUG.EXE
          if-no-files-found: warn
